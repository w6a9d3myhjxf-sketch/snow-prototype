<!doctype html><html lang="ja"><head><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><script>
/* Prototype entry gate: client-side SHA-256 check; not server authentication. */
(function(){
  try { if (sessionStorage.getItem('snow_trial_auth_v1') !== 'ok') {
    window.location.replace('index.html');
  } } catch(e) { window.location.replace('index.html'); }
})();
</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コース登録｜Prototype Ver.19</title><style>
body{font-family:Arial,"Yu Gothic",sans-serif;background:#f1f5f9;color:#172033;margin:0}main{max-width:1450px;margin:auto;padding:16px}nav,.panel{background:white;border-radius:9px;padding:15px;margin-bottom:14px}nav a{margin-left:16px}button,input,select{font:inherit;padding:8px;border:1px solid #aab5c5;border-radius:5px}button{cursor:pointer;background:#e2e8f0}button.primary{background:#1666bc;color:white}button.danger{color:#b42318}input,select{max-width:100%;box-sizing:border-box}.bar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.bar label{display:grid;gap:5px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1000px}th,td{border:1px solid #cbd5e1;padding:6px}td input,td select{width:100%}th{background:#e8eff8}td:last-child{white-space:nowrap;width:145px}td:last-child button{margin-right:3px}p{color:#526174}#status{font-weight:bold}
</style></head><body><main><div role="status" style="background:#fff3cd;color:#694c00;border:1px solid #e3c77b;border-radius:7px;padding:9px 12px;margin-bottom:12px;font-weight:600">Prototype Ver.19／試験運用中・動作保証なし</div><nav><strong>Prototype Menu</strong>　<a href="snow_timeline.html">雪氷時系列</a>　<a href="snow_courses.html" aria-current="page">コース登録</a>　<a href="gnss.html" onclick="return authenticateMenu(event, this)">GNSS</a>　<a href="#" onclick="return authenticateMenu(event, this)">Setting</a></nav><section class="panel"><h1>コース登録・編集 <small style="font-size:11px;font-weight:400;color:#64748b">Prototype Ver.19</small></h1><p>登録済みコースは原本として保存します。時系列で行を追加・削除しても原本は変わりません。コース変更時は別名で新規登録してください。</p><div class="bar"><label>登録済みコース<select id="templates"><option value="">新規登録</option></select></label><button id="new">新しいコース</button><label>コース名<input id="name" placeholder="コース名"></label><button id="save" class="primary">新規コースとして登録</button><button id="delete" class="danger">選択中のコースを削除</button></div><p id="status"></p></section><section class="panel"><div class="table-wrap"><table><thead><tr><th>作業区分</th><th>作業区分2</th><th>路線</th><th>作業区間・地点</th><th>本線・ランプ</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel"><button id="export">Export JSON</button><button id="importButton">Import JSON / Choose File</button><input id="import" type="file" accept=".json,application/json" style="display:none" aria-label="Choose JSON File"></section></main><script>
'use strict';
const $=id=>document.getElementById(id);
function authorize(){const value=prompt('Password');if(value===null)return false;if(value!=='nexcokp'){alert('Incorrect password');return false}return true}
const JOBS=['積込','開局','散布','部分散布','反転','回送','閉局','休憩','点検'];
const JOB2=['','開始','終了'];
const ROADS=['','東北道','上)東北道','下)東北道','圏央道','内)圏央道','外)圏央道','上)首都高','下)首都高','内)外環','外)外環','西)北関東道','東)北関東道'];
const RAMPS=['','本線','一般道',...Array.from({length:26},(_,i)=>String.fromCharCode(65+i)+'ランプ')];
const LOCATIONS={
 '首都高':['新郷出入口','川口本線料金所','川口JCT'],
 '外環':['川口中央IC','川口JCT','川口東IC','草加IC'],
 '東北道':['川口JCT','新浦和IC','浦和TB','岩槻IC','蓮田PA','白岡BS','久喜白岡JCT','久喜IC','加須IC','羽生IC','羽生PA','館林IC','大島BS','佐野藤岡IC','佐野SA','岩舟JCT','岩舟BS','栃木IC'],
 '北関東道':['岩舟JCT','佐野田沼IC'],
 '圏央道':['坂戸IC','川島IC','桶川北本IC','桶川加納IC','菖蒲PA','白岡菖蒲IC','久喜白岡JCT','幸手IC','五霞IC','境古河IC','坂東IC','坂東PA','常総IC','つくば西SIC','つくば中央IC']
};
const COMMON_BASES=['加須基地','岩槻基地','桶川加納基地','境古河基地'];
function locationChoices(road){return [...new Set([...COMMON_BASES,...(LOCATIONS[roadKey(road)]||[])])]}
function roadKey(road){return String(road||'').replace(/^[上下内外西東]\)/,'')}
function selectOptions(el,values,value){for(const v of values){const o=document.createElement('option');o.value=v;o.textContent=v||'選択';el.append(o)}if(value&&!values.includes(value)){const o=document.createElement('option');o.value=value;o.textContent=value+'（旧データ）';el.append(o)}el.value=value||''}
function updateLocations(tr,road,existing){const input=tr.querySelector('[data-field="location"]');const list=tr.querySelector('datalist');if(!input||!list)return;list.replaceChildren();for(const name of locationChoices(road)){const o=document.createElement('option');o.value=name;list.append(o)}if(existing!==undefined)input.value=existing}

const KEY='kp_snow_course_templates_v1';const FIELDS=['job','job2','road','location','ramp'];let draft=[],selected='';
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
function getAll(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}
function putAll(v){localStorage.setItem(KEY,JSON.stringify(v));refresh()}
function refresh(){const select=$('templates');const old=selected;select.replaceChildren(new Option('新規登録',''));getAll().forEach(t=>select.add(new Option(t.name,t.id)));select.value=old}
function collect(){draft=[...document.querySelectorAll('#rows tr')].map(tr=>Object.fromEntries(FIELDS.map(f=>[f,tr.querySelector(`[data-f="${f}"]`).value])))}
function render(){const body=$('rows');body.replaceChildren();draft.forEach((r,i)=>{const tr=document.createElement('tr');for(const f of FIELDS){const td=document.createElement('td');let el;if(f==='location'){el=document.createElement('input');el.setAttribute('list','places-'+i);const dl=document.createElement('datalist');dl.id='places-'+i;locationChoices(r.road).forEach(x=>dl.append(new Option(x,x)));td.append(dl)}else{el=document.createElement('select');selectOptions(el,f==='job'?['',...JOBS]:f==='job2'?JOB2:f==='road'?ROADS:RAMPS,r[f]||'')}el.value=r[f]||'';el.dataset.f=f;if(f==='road')el.addEventListener('change',()=>{const loc=tr.querySelector('[data-f="location"]');const dl=tr.querySelector('datalist');dl.replaceChildren();locationChoices(el.value).forEach(x=>dl.append(new Option(x,x)));});td.append(el);tr.append(td)}const td=document.createElement('td');for(const [label,action] of [['↑','above'],['↓','below'],['×','remove']]){const b=document.createElement('button');b.textContent=label;b.title=action==='above'?'直上に空行を追加':action==='below'?'直下に空行を追加':'この行を削除';b.onclick=()=>{collect();if(action==='remove'){draft.splice(i,1)}else draft.splice(i+(action==='below'?1:0),0,{job:'',job2:'',road:'',location:'',ramp:''});render()};td.append(b)}tr.append(td);body.append(tr)})}
function fresh(){selected='';$('name').value='';draft=[{job:'',job2:'',road:'',location:'',ramp:''}];refresh();render();$('status').textContent='新規コース'}
$('new').onclick=fresh;
$('templates').onchange=()=>{selected=$('templates').value;const t=getAll().find(x=>x.id===selected);if(!t){fresh();return}$('name').value=t.name;draft=structuredClone(t.rows);render();$('status').textContent='登録済み原本を参照中。保存は別コースとして登録します。'};

$('save').onclick=()=>{if(!authorize())return;collect();const name=$('name').value.trim();if(!name){alert('コース名を入力してください');return}const all=getAll();if(all.some(t=>t.name===name)){alert('同名コースがあります。変更したコースは別の名前で登録してください。');return}const t={id:uid(),name,rows:structuredClone(draft),createdAt:new Date().toISOString()};try{putAll([...all,t]);selected=t.id;refresh();$('status').textContent='新規コースを登録しました（原本は変更されません）'}catch(e){alert('保存失敗: '+e.message)}};
$('delete').onclick=()=>{if(!selected)return;if(!authorize())return;if(!confirm('登録済みの原本を削除しますか？'))return;putAll(getAll().filter(t=>t.id!==selected));fresh()};
$('export').onclick=()=>{if(!authorize())return;const blob=new Blob([JSON.stringify({schema:'snow-course-v1',courses:getAll()},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='snow_courses.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('importButton').onclick=()=>{if(!authorize())return;$('import').click()};
$('import').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;if(!authorize()){e.target.value='';return}try{const data=JSON.parse(await file.text());if(data.schema!=='snow-course-v1'||!Array.isArray(data.courses))throw Error('形式が違います');const all=getAll(),names=new Set(all.map(t=>t.name));let n=0;for(const t of data.courses){if(!t.name||!Array.isArray(t.rows)||names.has(t.name))continue;all.push({id:uid(),name:t.name,rows:t.rows.map(r=>Object.fromEntries(FIELDS.map(f=>[f,String(r[f]||'')])))});names.add(t.name);n++}putAll(all);$('status').textContent=n+'件読み込みました（同名はスキップ）'}catch(err){alert(err.message)}e.target.value=''};
fresh();
</script><script>
function authenticateMenu(event, link) {
  event.preventDefault();
  const password = window.prompt('Password');
  if (password === null) return false;
  if (password !== 'nexcokp') {
    window.alert('Incorrect password');
    return false;
  }
  if (link.textContent.trim() === 'GNSS') window.alert('GNSS page is not included in this prototype.');
  else window.alert('Setting page is not available yet.');
  return false;
}
</script></body></html>
