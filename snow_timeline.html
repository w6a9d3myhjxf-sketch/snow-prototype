function normalizeQuantity(f,v){if(v===null||v===undefined||String(v).trim()==='')return '';const n=Number(v);if(!Number.isFinite(n))return '';const step=f.endsWith('Agent')?0.5:0.1;return (Math.max(0,Math.round((n+Number.EPSILON)/step)*step)).toFixed(1)}
function formatQuantityInputs(){for(const f of quantityFields){const el=$(f);if(el.value!=='')el.value=formatQuantity(el.value)}}
function sync(){if(!current)return;for(const f of fields)current[f]=quantityFields.includes(f)?normalizeQuantity(f,$(f).value):$(f).value;current.workDate=(current.openAt||'').slice(0,10);document.querySelectorAll('#vehicleRows tr').forEach((tr,i)=>{for(const f of vehicleFields)current.vehicles[i][f]=tr.querySelector(`[data-vehicle-field="${f}"]`)?.value||''});
document.querySelectorAll('#rows tr[data-id]').forEach(tr=>{const r=current.rows.find(r=>r.id===tr.dataset.id);if(r)for(const f of rowFields)r[f]=tr.querySelector(`[data-field="${f}"]`)?.value||''})}
function setStatus(s){$('status').textContent=s}
function refreshDocs(){const prev=current?.id;const opts=getIndex().map(id=>getDoc(id)).filter(Boolean).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));$('docs').replaceChildren();for(const d of opts){const o=document.createElement('option');o.value=d.id;o.textContent=`${d.workDate||'日付未設定'} / ${d.vehicles?.[0]?.plate||d.plate||'車両未設定'} / ${d.course||'コース未設定'} / ver.${d.version}`;$('docs').append(o)}if(opts.some(d=>d.id===prev))$('docs').value=prev}
function renderVehicles(){const body=$('vehicleRows');body.replaceChildren();current.vehicles.forEach((v,i)=>{const tr=document.createElement('tr');const no=document.createElement('td');no.textContent=i+1;tr.append(no);for(const f of vehicleFields){const td=document.createElement('td');const input=document.createElement(f==='vehicleType'?'select':'input');input.dataset.vehicleField=f;if(f==='vehicleType'){selectOptions(input,vehicleTypes,v[f]||'')}else{input.value=v[f]||'';}input.setAttribute('aria-label',`${i+1}台目 ${f}`);input.addEventListener('input',()=>{dirty=true;setStatus('未保存の変更があります')});td.append(input);tr.append(td)}body.append(tr)})}
function render(){normalizeVehicles(current);for(const f of fields)$(f).value=quantityFields.includes(f)?normalizeQuantity(f,current[f]):current[f]||'';renderVehicles();const body=$('rows');body.replaceChildren();current.rows.forEach((r,i)=>{const tr=document.createElement('tr');tr.dataset.id=r.id;if(r.kind==='臨時')tr.className='irregular';const num=document.createElement('td');num.textContent=i+1;tr.append(num);for(const f of rowFields){const td=document.createElement('td');let el;if(f==='kind'){el=document.createElement('select');for(const k of ['予定','実績','予定＋実績','臨時']){const o=document.createElement('option');o.value=k;o.textContent=k;el.append(o)}}else if(['job','job2','road','ramp'].includes(f)){el=document.createElement('select');selectOptions(el,f==='job'?['',...JOBS]:f==='job2'?JOB2:f==='road'?ROADS:RAMPS,r[f]||'')}
else{el=document.createElement('input');if(f==='planned'||f==='actual'){el.type='text';el.inputMode='numeric';el.placeholder='HH:MM';el.maxLength=5}else{el.type='text';if(f==='location'){const dl=document.createElement('datalist');dl.id='places_'+r.id;td.append(dl);el.setAttribute('list',dl.id)}}}
el.dataset.field=f;if(!['job','job2','road','ramp'].includes(f))el.value=r[f]||'';
if(f==='planned'||f==='actual'){
 const wrapper=document.createElement('div');wrapper.className='time-editor';
 const now=document.createElement('button');now.type='button';now.className='now-btn';now.textContent='🕒';now.title='現在時刻を入力';now.setAttribute('aria-label',`${i+1}行 ${f} に現在時刻を入力`);
 now.addEventListener('click',()=>{const d=new Date();el.value=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');el.dispatchEvent(new Event('input',{bubbles:true}));el.focus();});
 const hour=document.createElement('select');hour.title='時を選択';hour.setAttribute('aria-label',`${i+1}行 ${f} の時`);
 const minute=document.createElement('select');minute.title='分を選択';minute.setAttribute('aria-label',`${i+1}行 ${f} の分`);
 for(const [sel,label,max] of [[hour,'時',24],[minute,'分',60]]){
   const first=document.createElement('option');first.value='';first.textContent=label;sel.append(first);
   for(let n=0;n<max;n++){const o=document.createElement('option');o.value=String(n).padStart(2,'0');o.textContent=o.value;sel.append(o)}
 }
 const updatePickers=()=>{const m=/^(\d{1,2}):(\d{1,2})$/.exec(el.value.trim());if(m&&Number(m[1])<24&&Number(m[2])<60){hour.value=m[1].padStart(2,'0');minute.value=m[2].padStart(2,'0')}else{hour.value='';minute.value=''}};
 const applyPickers=()=>{const old=/^(\d{1,2}):(\d{1,2})$/.exec(el.value.trim());const h=hour.value||(old&&Number(old[1])<24?old[1].padStart(2,'0'):'00');const m=minute.value||(old&&Number(old[2])<60?old[2].padStart(2,'0'):'00');el.value=h+':'+m;updatePickers();el.dispatchEvent(new Event('input',{bubbles:true}));};
 hour.addEventListener('change',applyPickers);minute.addEventListener('change',applyPickers);
 el.addEventListener('input',updatePickers);
 wrapper.append(el,now,hour,minute);td.append(wrapper);updatePickers();
}

if(f==='road')el.addEventListener('change',()=>{updateLocations(tr,el.value);dirty=true;setStatus('未保存の変更があります')});
if(f==='location')setTimeout(()=>updateLocations(tr,r.road,r.location||''),0);
el.setAttribute('aria-label',`${i+1}行 ${f}`);el.addEventListener('input',()=>{dirty=true;setStatus('未保存の変更があります')});if(f==='planned'||f==='actual'){el.addEventListener('blur',()=>{const v=el.value.trim();if(!v)return;const m=/^(\d{1,2}):(\d{1,2})$/.exec(v);if(m&&Number(m[1])<24&&Number(m[2])<60){el.value=m[1].padStart(2,'0')+':'+m[2].padStart(2,'0')}else{alert('時刻は HH:MM 形式で入力してください（例：08:05）');el.focus()}})}if(f!=='planned'&&f!=='actual')td.append(el);tr.append(td)}const td=document.createElement('td');td.className='narrow';for(const [symbol,action,title] of [['↑','insertAbove','直上に空行を追加'],['↓','insertBelow','直下に空行を追加'],['×','remove','削除']]){const b=document.createElement('button');b.textContent=symbol;b.title=title;b.dataset.action=action;b.addEventListener('click',()=>editRow(r.id,action));td.append(b)}tr.append(td);body.append(tr)});setStatus(`現在の版：ver.${current.version}　${dirty?'（未保存）':'（保存済み）'}`)}
function editRow(id,action){
 sync();
 const i=current.rows.findIndex(r=>r.id===id);
 if(i<0)return;
 if(action==='remove'){
  if(!confirm(`${i+1}行目を削除しますか？`))return;
  current.rows.splice(i,1);
 }else if(action==='insertAbove'){
  current.rows.splice(i,0,emptyRow());
 }else if(action==='insertBelow'){
  current.rows.splice(i+1,0,emptyRow());
 }
 dirty=true;
 render();
}
function addRow(kind){sync();current.rows.push(emptyRow(kind));dirty=true;render()}
function updateOpeningFromRows(){
 const open=current.rows.find(r=>r.job==='開局'&&(r.actual||r.planned));
 if(!open)return;
 const t=open.actual||open.planned;
 if(!/^\d{2}:\d{2}$/.test(t))return;
 const base=(current.openAt||current.workDate||new Date().toLocaleDateString('sv-SE')).slice(0,10);
 current.openAt=base+'T'+t;current.workDate=base;$('openAt').value=current.openAt;
}
function save(){sync();if(!current)return;updateOpeningFromRows();current.version++;current.updatedAt=new Date().toISOString();try{localStorage.setItem(PREFIX+current.id,JSON.stringify(current));const ix=getIndex();if(!ix.includes(current.id)){ix.push(current.id);localStorage.setItem(INDEX,JSON.stringify(ix))}dirty=false;refreshDocs();render();setStatus(`ver.${current.version} を保存しました`)}catch(e){current.version--;setStatus('保存に失敗：'+e.message)}}
function guard(){return !dirty||confirm('未保存の変更があります。破棄して切り替えますか？')}
function load(id){if(!guard())return;const d=getDoc(id);if(!d)return;current=normalizeVehicles(d);dirty=false;render();refreshDocs()}
function csvQuote(s){return '"'+String(s??'').replace(/"/g,'""')+'"'}
function download(blob,name){const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function baseName(){return `${current.workDate||'日付未設定'}_${(current.vehicles?.[0]?.plate||'車両未設定').replace(/[\\/:*?"<>|]/g,'_')}_ver${current.version}`}
function csv(){sync();const header=['開局日時','作業区分（全体）','作業コース',...quantityLabels,...Array.from({length:5},(_,i)=>vehicleFields.map(f=>`${i+1}台目_${f}`)).flat(),'No','区分','予定時刻','実績時刻','作業区分','作業区分2','路線','作業区間・地点','本線・ランプ','備考'];const meta=[current.openAt,current.workCategory,current.course,...quantityFields.map(f=>formatQuantity(current[f])),...current.vehicles.flatMap(v=>vehicleFields.map(f=>v[f]))];const rows=current.rows.map((r,i)=>[...meta,i+1,r.kind,r.planned,r.actual,r.job,r.job2||'',r.road,r.location,r.ramp||'',r.note]);const txt='\uFEFF'+[header,...rows].map(row=>row.map(csvQuote).join(',')).join('\r\n');download(new Blob([txt],{type:'text/csv;charset=utf-8'}),baseName()+'.csv')}
function pdf(){
 sync();
 if(dirty||!current.version){alert('PDF出力前に「保存」を押してください。');return}
 const selectedLabel=$('docs').selectedOptions[0]?.textContent||baseName();
 const pdfFileName=selectedLabel.replace(/[\\/:*?"<>|]/g,'_').trim()+'.pdf';
 const title='雪氷作業時系列';
 const rowHTML=(r,i)=>`<tr><td>${i+1}</td><td>${esc(r.kind)}</td><td>${esc(r.planned)}</td><td>${esc(r.actual)}</td><td>${esc(r.job)}</td><td>${esc(r.job2||'')}</td><td>${esc(r.road)}</td><td>${esc(r.location)}</td><td>${esc(r.ramp==='選択'?'':(r.ramp||''))}</td><td>${esc(r.note)}</td></tr>`;
 const vrows=current.vehicles.map((v,i)=>`<tr><td>${i+1}</td>${vehicleFields.map(f=>`<td>${esc(v[f])}</td>`).join('')}</tr>`).join('');
 const headers='<tr><th>No.</th><th>区分</th><th>予定時刻</th><th>実績時刻</th><th>作業区分</th><th>作業区分2</th><th>路線</th><th>作業区間・地点</th><th>本線・ランプ</th><th>備考</th></tr>';
 // ページを明示的に分割し、2ページ目以降の見出しと表を別要素にする。
 const chunks=[];
 const all=current.rows;
 if(all.length===0)chunks.push([]);
 else {
   chunks.push(all.slice(0,18).map((r,i)=>rowHTML(r,i)));
   for(let i=18;i<all.length;i+=20)chunks.push(all.slice(i,i+20).map((r,j)=>rowHTML(r,i+j)));
 }
 const pages=chunks.map((chunk,i)=>`<section class="pdf-page">
   <header class="page-title">${title}　全${chunks.length}枚中${i+1}枚</header>
   ${i===0?`<div class="top"><div class="meta">開局日時：${esc(current.openAt)}<br>作業区分：${esc(current.workCategory)}<br>作業コース：${esc(current.course)}${quantityFields.map((f,j)=>`<br>${esc(quantityLabels[j])}：${esc(formatQuantity(current[f]))}`).join('')}</div><table class="vehicles"><thead><tr><th>No.</th><th>車両種別</th><th>車両ナンバー</th><th>無線番号</th><th>運転者名</th><th>助手名</th></tr></thead><tbody>${vrows}</tbody></table></div>`:''}
   <table class="timeline"><thead>${headers}</thead><tbody>${chunk.join('')}</tbody></table>
 </section>`).join('');
 const html=`<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>${esc(pdfFileName)}</title><style>
 @page{size:A4 landscape;margin:10mm 12mm 10mm}
 *{box-sizing:border-box}
 body{margin:0;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;font-size:10px}
 .pdf-page{break-after:page;page-break-after:always}
 .pdf-page:last-child{break-after:auto;page-break-after:auto}
 .page-title{font-size:15pt;font-weight:bold;line-height:1.4;margin:0 0 8mm}
 .pdf-page:first-of-type .page-title{margin-bottom:3mm}
 table{width:100%;border-collapse:collapse;table-layout:fixed}
 th,td{border:1px solid #777;padding:5px;overflow-wrap:anywhere}
 th{background:#eee}
 tr{break-inside:avoid;page-break-inside:avoid}
 .top{display:grid;grid-template-columns:1fr 2.4fr;gap:14px;margin:0 0 8px}
 .meta{font-size:12px}
 .vehicles{font-size:10px}
 .timeline{font-size:10px}
 .timeline th:nth-child(1){width:3%}
 .timeline th:nth-child(2){width:7%}
 .timeline th:nth-child(3),.timeline th:nth-child(4){width:6%}
 .timeline th:nth-child(5),.timeline th:nth-child(6){width:12%}
 .timeline th:nth-child(7){width:9%}
 .timeline th:nth-child(8){width:15%}
 .timeline th:nth-child(9){width:11%}
 .timeline th:nth-child(10){width:19%}
 button{margin-bottom:12px}
 .save-help{font-size:12px}
 @media print{button,.save-help{display:none!important}}
 </style></head><body><button onclick="print()">印刷／PDF保存</button><p class="save-help">PDF保存時の推奨ファイル名：${esc(pdfFileName)}　（iPadでは共有メニューから「ファイルに保存」）</p>${pages}</body></html>`;
 const w=window.open('','_blank');
 if(!w){alert('ポップアップがブロックされました');return}
 w.document.open();w.document.write(html);w.document.close();
 setTimeout(()=>{w.focus();w.print()},350);
}
const COURSE_STORE='kp_snow_course_templates_v1';
const templateFields=['job','job2','road','location','ramp'];
function getTemplates(){try{const v=JSON.parse(localStorage.getItem(COURSE_STORE)||'[]');return Array.isArray(v)?v:[]}catch{return []}}
function putTemplates(v){localStorage.setItem(COURSE_STORE,JSON.stringify(v));refreshTemplates()}
function refreshTemplates(){const sel=$('courseTemplates'),prev=sel.value;sel.replaceChildren();const blank=document.createElement('option');blank.value='';blank.textContent='コースを選択';sel.append(blank);for(const t of getTemplates()){const o=document.createElement('option');o.value=t.id;o.textContent=t.name;sel.append(o)}if(getTemplates().some(t=>t.id===prev))sel.value=prev}
$('applyCourse').onclick=()=>{const t=getTemplates().find(t=>t.id===$('courseTemplates').value);if(!t){alert('コースを選択してください');return}sync();if(current.rows.some(r=>templateFields.some(f=>r[f])||r.planned||r.actual||r.note)&&!confirm('現在の時系列行をコースの登録内容で置き換えます。よろしいですか？'))return;current.course=t.name;current.rows=t.rows.map(r=>({...emptyRow(),...Object.fromEntries(templateFields.map(f=>[f,r[f]||'']))}));if(!current.rows.length)current.rows=[emptyRow()];dirty=true;render()};
refreshTemplates();
$('new').onclick=()=>{if(!guard())return;current=blank();dirty=true;render()};$('save').onclick=save;$('add').onclick=()=>addRow('予定');$('irregular').onclick=()=>addRow('臨時');$('csv').onclick=csv;$('pdf').onclick=pdf;$('docs').onchange=e=>load(e.target.value);$('delDoc').onclick=()=>{if(!current?.version){current=blank();dirty=true;render();return}if(!confirm('この時系列と全修正履歴を端末から削除しますか？'))return;localStorage.removeItem(PREFIX+current.id);localStorage.setItem(INDEX,JSON.stringify(getIndex().filter(id=>id!==current.id)));current=blank();dirty=true;refreshDocs();render()};for(const f of fields){$(f).addEventListener('input',()=>{dirty=true;setStatus('未保存の変更があります')});if(quantityFields.includes(f))$(f).addEventListener('blur',()=>{if($(f).value!=='')$(f).value=normalizeQuantity(f,$(f).value)})}window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
const ids=getIndex();current=ids.length?getDoc(ids[0]):null;if(current)normalizeVehicles(current);if(!current){current=blank();dirty=true}refreshDocs();render();
