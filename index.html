<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><title>雪氷時系列｜試験運用ログイン</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf2f7;color:#172033;font-family:system-ui,"Yu Gothic",sans-serif}.panel{background:white;padding:28px;box-sizing:border-box;width:min(92vw,430px);border-radius:12px;box-shadow:0 5px 24px #17203318}h1{font-size:23px}p{line-height:1.6}.notice{font-weight:700;color:#875400}label{display:block;margin:16px 0 6px}input{box-sizing:border-box;width:100%;font-size:18px;padding:12px;border:1px solid #9aabc1;border-radius:6px}button{margin-top:14px;width:100%;padding:13px;background:#1666bc;color:#fff;border:0;border-radius:6px;font-size:17px}#error{color:#b42318;min-height:1.5em}</style></head><body><main class="panel"><h1>雪氷時系列</h1><p class="notice">Prototype Ver.19／試験運用中・動作保証なし</p><p>試験運用用のパスワードを入力してください。</p><form id="login"><label for="password">パスワード</label><input id="password" type="password" required autocomplete="current-password"><button type="submit">ログイン</button><p id="error" role="alert" aria-live="polite"></p></form></main><script>
const EXPECTED_HASH='fdbda566572cb6f21dfcf42c9eaf59d4906d0a9654012c7acf79b30e3e2d1ad0';
async function sha256(text){const bytes=new TextEncoder().encode(text);const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('')}
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('error');err.textContent='';try{const hash=await sha256(document.getElementById('password').value);if(hash!==EXPECTED_HASH){err.textContent='パスワードが違います。';return}sessionStorage.setItem('snow_trial_auth_v1','ok');window.location.replace('snow_timeline.html')}catch(ex){err.textContent='認証できませんでした。HTTPSで開いてください。'}});
</script></body></html>
